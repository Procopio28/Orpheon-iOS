name: Build Orpheon IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build IPA
        working-directory: .
        run: |
          chmod +x ./build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Orpheon-unsigned-IPA
          path: Orpheon.ipa
          if-no-files-found: error
          retention-days: 14
